name: Build & Push Docker image to Container Registry and Deploy to DO apps

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      environment:
        required: true
        type: string
      deploy_app_id:
        required: false
        type: string
      sha:
        required: false
        type: string
    secrets:
      do_token:
        required: true
      cross_repo_token:
        required: true
      envs:
        required: false
    outputs:
      deploy_id:
        description: The digitalocean deploy id
        value: ${{ jobs.build-deploy.outputs.deploy_id }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      TAG: registry.digitalocean.com/animately/${{ inputs.name }}:${{ inputs.environment }}
    outputs:
      deploy_id: ${{ steps.deployment.outputs.deploy_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          token: ${{ secrets.cross_repo_token }}
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha != null }}

      - name: Checkout code
        uses: actions/checkout@v7
        if: ${{ github.event_name != 'pull_request' }}
        with:
          submodules: true
          token: ${{ secrets.cross_repo_token }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.do_token }}

      - name: Login to registry
        run: doctl registry login

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create secrets file
        env:
          ENVS: ${{ secrets.envs }}
        run: printf '%s\n' "$ENVS" > /tmp/secrets.txt

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.TAG }}
          cache-from: type=gha,scope=${{ inputs.environment }}
          cache-to: type=gha,scope=${{ inputs.environment }},mode=max
          secret-files: |
            "envs=/tmp/secrets.txt"

      - name: Deploy DO apps
        if: ${{ inputs.deploy_app_id != '' }}
        id: deployment
        timeout-minutes: 30
        run: |
          echo "Create deployment for app: ${{ inputs.deploy_app_id }}"
          deploy_id=$(doctl apps create-deployment ${{ inputs.deploy_app_id }} --format ID --no-header --wait)
          echo "deploy_id=$deploy_id" >> $GITHUB_OUTPUT
